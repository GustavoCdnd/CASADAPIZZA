const Logo = ({ className = "h-24" }) => <img src={LOGO} alt="Casa da Pizza – Deus é fiel" className={"w-auto select-none " + className} />;

function Loader({ done }) {
  return (
    <div className={"fixed inset-0 z-50 bg-white flex flex-col items-center justify-center transition-opacity duration-500 " + (done ? "opacity-0 pointer-events-none" : "opacity-100")}>
      <div className="pop"><div className="float"><Logo className="h-52" /></div></div>
      <div className="mt-8 w-48 h-2 bg-pz-y/40 rounded-full overflow-hidden">
        <div className="h-full bg-pz-r rounded-full" style={{ animation: "bar 2s linear forwards" }} />
      </div>
      <p className="mt-3 font-d text-pz-b font-bold">Carregando</p>
    </div>
  );
}

function Reveal({ children, className = "", delay = 0 }) {
  const ref = useRef(null);
  const [on, setOn] = useState(false);
  useEffect(() => {
    const o = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setOn(true); o.disconnect(); } }, { threshold: 0.15 });
    o.observe(ref.current);
    return () => o.disconnect();
  }, []);
  return <div ref={ref} style={{ transitionDelay: delay + "ms" }} className={"rv " + (on ? "on " : "") + className}>{children}</div>;
}

function Btn({ children, className = "", href = LINK }) {
  return <a href={href} target="_blank" rel="noopener" className={"inline-flex items-center justify-center gap-2 font-d font-bold rounded-full px-7 py-3 text-lg transition hover:scale-105 active:scale-95 " + className}>{children}</a>;
}

function Header({ darkMode, onToggleTheme }) {
  return (
    <header className="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-gray-200">
      <div className="max-w-6xl mx-auto flex items-center justify-between px-4 py-2">
        <a href="#topo" aria-label="Casa da Pizza Petrópolis"><Logo className="h-12" /></a>
        <nav className="hidden md:flex gap-6 font-d font-bold text-pz-b">
          <a href="#unidades" className="hover:text-pz-r">Unidades</a>
          <a href="#sobre" className="hover:text-pz-r">Sobre</a>
          <a href="#contato" className="hover:text-pz-r">Contato</a>
        </nav>
        <div className="flex items-center gap-2"><button type="button" className="theme-toggle" onClick={onToggleTheme} aria-label={darkMode ? "Ativar tema claro" : "Ativar tema escuro"} title={darkMode ? "Mudar para tema claro" : "Mudar para tema escuro"}>{darkMode ? "Modo claro" : "Modo escuro"}</button><Btn className="bg-pz-r text-white text-base !px-5 !py-2 pulse2">Peça agora</Btn></div>
      </div>
    </header>
  );
}

const pts = (n, r0, r1, off = 0) => Array.from({ length: n }, (_, i) => { const a = i * 2.399 + off, r = r0 + (r1 - r0) * ((i * 0.618) % 1); return [100 + r * Math.cos(a), 100 + r * Math.sin(a)]; });
function Pizza({ v = "pepperoni", className = "" }) {
  return (
    <svg viewBox="0 0 200 200" className={"drop-shadow-2xl " + className} role="img" aria-label="Pizza">
      <circle cx="100" cy="100" r="96" fill="#E3963C" stroke="#B9702A" strokeWidth="3" />
      <circle cx="100" cy="100" r="84" fill="#F2B84B" />
      <circle cx="100" cy="100" r="80" fill="#FFD25A" />
      {pts(14, 10, 72, 2).map(([x, y], i) => <circle key={"c" + i} cx={x} cy={y} r="7" fill="#FFE9A3" opacity=".8" />)}
      {v === "pepperoni" && pts(11, 18, 68).map(([x, y], i) => <g key={i}><circle cx={x} cy={y} r="11" fill="#C62828" stroke="#8E1B1B" strokeWidth="1.5" /><circle cx={x - 3} cy={y - 2} r="1.6" fill="#8E1B1B" /><circle cx={x + 3} cy={y + 3} r="1.6" fill="#8E1B1B" /></g>)}
      {v === "pepperoni" && pts(8, 14, 72, 1).map(([x, y], i) => <path key={"p" + i} d={"M" + x + " " + y + "l7 -3 3 6z"} fill="#43A047" />)}
      {v === "calabresa" && pts(10, 14, 70).map(([x, y], i) => <g key={i}><circle cx={x} cy={y} r="9" fill="#B5523B" stroke="#7D2F1F" strokeWidth="1.5" /><circle cx={x + 2} cy={y - 2} r="1.4" fill="#7D2F1F" /></g>)}
      {v === "calabresa" && pts(9, 12, 72, 1.5).map(([x, y], i) => <circle key={"o" + i} cx={x} cy={y} r="8" fill="none" stroke="#fff" strokeWidth="2" opacity=".9" />)}
      {v === "calabresa" && pts(6, 20, 68, 3).map(([x, y], i) => <g key={"v" + i}><circle cx={x} cy={y} r="4.5" fill="#222" /><circle cx={x} cy={y} r="1.6" fill="#FFD25A" /></g>)}
      {v === "queijos" && pts(9, 16, 68).map(([x, y], i) => <g key={i}><circle cx={x} cy={y} r="10" fill="#E53935" /><circle cx={x} cy={y} r="6" fill="#EF6C68" /></g>)}
      {v === "queijos" && pts(8, 14, 70, 2).map(([x, y], i) => <circle key={"m" + i} cx={x} cy={y} r="8" fill="#FFF6DC" opacity=".95" />)}
      {v === "queijos" && pts(8, 12, 72, 4).map(([x, y], i) => <ellipse key={"b" + i} cx={x} cy={y} rx="7" ry="3.5" fill="#2E7D32" transform={"rotate(" + (i * 47) + " " + x + " " + y + ")"} />)}
      {[0, 1, 2, 3].map(k => <line key={k} x1="100" y1="100" x2={100 + 94 * Math.cos(k * Math.PI / 4)} y2={100 + 94 * Math.sin(k * Math.PI / 4)} stroke="#C98A2B" strokeWidth="1.5" opacity=".7" transform="rotate(0)" />)}
      {[0, 1, 2, 3].map(k => <line key={"n" + k} x1="100" y1="100" x2={100 - 94 * Math.cos(k * Math.PI / 4)} y2={100 - 94 * Math.sin(k * Math.PI / 4)} stroke="#C98A2B" strokeWidth="1.5" opacity=".7" />)}
    </svg>
  );
}

// Para trocar pelas fotos reais, informe "img" em cada slide (ex.: img: "data:image/jpeg;base64,..." ou URL permitida).
const SLIDES = [
  { tag: "BORDA GRÁTIS", big: "Borda grátis", sub: "em pedidos a partir de", price: "R$ 50", pizzas: ["queijos"], bg: "from-pz-r to-red-800", fg: "text-white" },
  { tag: "PREÇO ESPECIAL", big: "Pizzas", sub: "a partir de", price: "R$ 40", pizzas: ["pepperoni"], bg: "from-pz-y to-amber-400", fg: "text-pz-b" },
  { tag: "COMBO TRADICIONAL", big: "2 pizzas tradicionais", sub: "a partir de", price: "R$ 74,90", pizzas: ["calabresa", "queijos"], bg: "from-pz-b to-amber-900", fg: "text-pz-y" },
];

function Banner() {
  const [i, setI] = useState(0);
  useEffect(() => { const t = setInterval(() => setI(v => (v + 1) % SLIDES.length), 5000); return () => clearInterval(t); }, []);
  const go = d => setI(v => (v + d + SLIDES.length) % SLIDES.length);
  return (
    <div id="promocoes" className="relative scroll-mt-24">
      <div className="relative overflow-hidden rounded-3xl shadow-xl grid">
        {SLIDES.map((x, k) => (
          <a key={k} href={LINK} target="_blank" rel="noopener" aria-label={x.big + " " + x.price + " – aproveitar"}
            className={"col-start-1 row-start-1 relative overflow-hidden bg-gradient-to-br " + x.bg + " " + x.fg + " flex flex-col sm:flex-row items-center justify-center sm:justify-between gap-4 p-8 sm:px-16 min-h-[520px] sm:min-h-[380px] transition-all duration-700 " + (k === i ? "opacity-100 translate-x-0" : "opacity-0 pointer-events-none " + (k < i ? "-translate-x-10" : "translate-x-10"))}>
            <div className="absolute -right-16 -bottom-20 w-80 h-80 rounded-full bg-white/10" />
            <div className="relative text-center sm:text-left">
              <span className="inline-block bg-white text-pz-r font-d font-extrabold text-sm px-3 py-1 rounded-full">{x.tag}</span>
              <h2 className="font-d font-extrabold text-3xl sm:text-5xl leading-tight mt-3">{x.big}</h2>
              <p className="font-bold text-lg mt-2 opacity-90">{x.sub}</p>
              <div className="font-d font-extrabold text-6xl sm:text-7xl leading-none whitespace-nowrap">{x.price}</div>
              <span className="inline-block mt-4 bg-white text-pz-r font-d font-bold text-lg px-7 py-3 rounded-full shadow-lg">Aproveitar a promoção →</span>
            </div>
            <div className="relative flex items-center float shrink-0">
              {x.img ? <img src={x.img} alt={x.big} className="w-48 h-48 sm:w-72 sm:h-72 rounded-full object-cover shadow-2xl" /> :
                x.pizzas.map((v, n) => <Pizza key={n} v={v} className={(x.pizzas.length > 1 ? "w-36 sm:w-56 " : "w-48 sm:w-72 ") + (n ? "-ml-10 mt-10 sm:mt-16" : "")} />)}
            </div>
          </a>
        ))}
      </div>
      <button onClick={() => go(-1)} aria-label="Anterior" className="absolute left-2 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/90 shadow font-bold text-pz-b hover:scale-110 transition">‹</button>
      <button onClick={() => go(1)} aria-label="Próxima" className="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/90 shadow font-bold text-pz-b hover:scale-110 transition">›</button>
      <div className="flex justify-center gap-2 mt-4">
        {SLIDES.map((_, k) => <button key={k} onClick={() => setI(k)} aria-label={"Slide " + (k + 1)} className={"h-2.5 rounded-full transition-all " + (k === i ? "w-8 bg-pz-r" : "w-2.5 bg-gray-300")} />)}
      </div>
    </div>
